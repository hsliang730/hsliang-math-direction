<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hsliang 數學數位學習平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(28, 28, 30, 0.65);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent-blue: #2997ff;
            --accent-purple: #bf5af2;
            --accent-orange: #ff9f0a;
            --apple-glass: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 導覽列 */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 44px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 9999;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-content {
            width: 100%;
            max-width: 980px;
            padding: 0 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .nav-logo {
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Hero 區塊 */
        .hero {
            padding-top: 120px;
            padding-bottom: 60px;
            text-align: center;
            max-width: 980px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
        }

        .hero-tag {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-orange);
            letter-spacing: 0.02em;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .hero-title {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -0.015em;
            line-height: 1.07143;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 24px;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 0.007em;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.33337;
        }

        /* Bento Grid 佈局 */
        .grid-container {
            max-width: 980px;
            margin: 0 auto 80px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
            .hero-title {
                font-size: 40px;
            }
            .hero-subtitle {
                font-size: 19px;
            }
        }

        .bento-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            min-height: 480px;
        }

        .bento-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .card-header {
            z-index: 2;
        }

        .card-category {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .card-desc {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.46667;
            margin-bottom: 24px;
        }

        .card-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 2;
        }

        .btn-primary {
            background: #ffffff;
            color: #000000;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 980px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: #e8e8ed;
            transform: scale(1.02);
        }

        /* Preview UI Block */
        .preview-box {
            position: relative;
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            margin-top: auto;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 系統圖卡專屬色彩 */
        .system-card .card-category { color: var(--accent-blue); }
        .system-card .preview-box {
            background: radial-gradient(circle at 50% 50%, rgba(41, 151, 255, 0.15) 0%, rgba(0, 0, 0, 0.4) 100%);
        }

        .timer-card .card-category { color: var(--accent-purple); }
        .timer-card .preview-box {
            background: radial-gradient(circle at 50% 50%, rgba(191, 90, 242, 0.15) 0%, rgba(0, 0, 0, 0.4) 100%);
        }

        .timer-digits {
            font-size: 42px;
            font-weight: 700;
            font-monospaced: digits;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #fff, #a1a1a6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .system-ui-badge {
            background: rgba(41, 151, 255, 0.2);
            color: var(--accent-blue);
            border: 1px solid rgba(41, 151, 255, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Footer */
        footer {
            background: #111113;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px 20px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <!-- 導覽列 -->
    <nav>
        <div class="nav-content">
            <a href="#" class="nav-logo">
                <i class="fa-solid fa-square-root-variable"></i>
                <span>hsliang Math</span>
            </a>
            <span>數位學習門戶</span>
        </div>
    </nav>

    <!-- Hero 區塊 -->
    <section class="hero">
        <div class="hero-tag">重塑數學學習體驗</div>
        <h1 class="hero-title">hsliang 數學數位學習平台</h1>
        <p class="hero-subtitle">集結模組化學習管理系統與專業考試計時器，打造極致優雅高效的課堂與自主學習環境。</p>
    </section>

    <!-- Bento 卡片區 -->
    <main class="grid-container">

        <!-- 卡片 1: 數學學習系統 -->
        <div class="bento-card system-card">
            <div class="card-header">
                <div class="card-category">Learning System</div>
                <h2 class="card-title">數學數位學習系統</h2>
                <p class="card-desc">整合模組化章節觀念、線上互動題庫與即時學習進度評量，幫助學生建構完整數學思維系統。</p>
            </div>
            
            <div class="preview-box">
                <div class="system-ui-badge">
                    <i class="fa-solid fa-graduation-cap"></i> 系統化章節與即時評量
                </div>
            </div>

            <div class="card-actions" style="margin-top: 24px;">
                <a href="https://hsliang-math-system.netlify.app" target="_blank" class="btn-primary">
                    立即前往 <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>
        </div>

        <!-- 卡片 2: 考試倒數計時器 -->
        <div class="bento-card timer-card">
            <div class="card-header">
                <div class="card-category">Exam Assistant</div>
                <h2 class="card-title">考試倒數計時器</h2>
                <p class="card-desc">專為數學測驗與課堂演練設計的大螢幕計時工具，直觀的視覺倒數幫助掌握精準答題節奏。</p>
            </div>

            <div class="preview-box">
                <div class="timer-digits">50:00</div>
            </div>

            <div class="card-actions" style="margin-top: 24px;">
                <a href="https://hsliang-math-exam-timer.netlify.app" target="_blank" class="btn-primary">
                    立即前往 <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>© hsliang Math. All rights reserved.</p>
    </footer>

</body>
</html>
